    <script>
        console.log(food);

        $("#foodlist").empty();
        food.forEach(function (item) {
            const strHTML = `<div class="col">
                                <div class="card p-3">
                                  <img src="${item.PicURL}" class="card-img-top" alt="...">
                                    <div class="card-body">
                                        <div class="display-6 fw-900 text-start mb-3">${item.Name}</div>
                                        <div class="h5 text-center">地址:${item.City}${item.Town}${item.Address}</div>
                                        <div class="h6 text-end">電話:${item.Tel}</div>
                                        <p class="card-text text-truncate mt-3">${item.HostWords}</p>
                                    </div>
                                </div>
                            </div>`;
            $("#foodlist").append(strHTML);
        });
