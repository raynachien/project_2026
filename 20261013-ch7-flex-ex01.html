    <style>
        .imgbox{
            height: 220px;
        }
        .timeline-section{
            position: relative;
        }
        .timeline-section::before{
            position: absolute;
            content: "";
            width: 5px;
            background-color: rgba(223, 20, 71, 0.3);
            top: 0;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .timeline-section-pointer{
            position: relative;
        }
        .timeline-section-pointer::before{
            position: absolute;
            content: "";
            width: 30px;
            height: 30px;
            background-color: rgba(83, 2, 22, 0.8);
            border-radius: 50%;
            border: 8px solid rgba(63, 3, 18, 0.9);
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }
        @media screen and (max-width:768px) {
            .timeline-section::before, .timeline-section-pointer::before{
                display: none;
            }
            /* .timeline-section::before{
                left: -20px;
            }
            .timeline-section-pointer::before{

            } */
        } 
    </style>
</head>
