<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ch8. Forms表單</title>
    <link rel="stylesheet" href="CSS/bootstrap.min.css">
    <link rel="stylesheet" href="CSS/20260924.css">
</head>
<body>
    <div class="container py-5">
        <div class="display-2 fw-900 text-center mt-4 text-bg-success p-3">ch8. Forms</div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">1. 基本表單樣式</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">帳號</label>
                    <input type="text" class="form-control" id="username" placeholder="請輸入一個英文大寫...">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control form-control-lg" id="password">
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-sm" id="email">
                </div>
                <div class="mb-3">
                    <label for="num" class="form-label">人數</label>
                    <input type="number" class="form-control" id="num" min="0" max="10" value="1">
                </div>
                <div class="mb-3">
                    <label for="formfile" class="form-label">檔案</label>
                    <input type="file" class="form-control" id="formfile">
                </div>
                <div>
                    <label class=""form-label for="foodlist">點餐(datalist)</label>
                    <input type="text" class="form-control" id="foodlist" list="datalistOption">
                    <datalist id="datalistOption">
                        <option value="漢堡"></option>
                        <option value="拉麵"></option>
                        <option value="壽司"></option>
                        <option value="牛肉麵"></option>
                    </datalist>
                </div>
            </div>
        </div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">2. select選單</div>
        <div class="row">
            <div class="col-12">
                <label for="" class="form-label">請選擇縣市</label>
                <select name="" id="" class="form-select form-select-lg">
                    <!-- value是給程式看的，中間的字是給使用者看的 -->
                     <option value="" class="text-center" disabled selected>---請選擇縣市---</option>
                    <option value="臺中市">臺中市</option>
                    <option value="彰化縣">彰化縣</option>
                    <option value="雲林縣">雲林縣</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="臺南縣">臺南縣</option>
                </select>
            </div>
        </div>
        <div class="display-5 fw-900 mt-3 text-primary p-3">3. checkbox(複選)，radio(單選)</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk01">
                    <label for="chk01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk02">
                    <label for="chk02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk03">
                    <label for="chk03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk04">
                    <label for="chk04" class="form-check-label">選項04</label>
                </div>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-12">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk01">
                    <label for="chk01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk02">
                    <label for="chk02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk03">
                    <label for="chk03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="" id="chk04">
                    <label for="chk04" class="form-check-label">選項04</label>
                </div>
            </div>
            <hr class="my-3">
            <div class="col-12">
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad01">
                    <label for="rad01" class="form-check-label">選項01</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad02">
                    <label for="rad02" class="form-check-label">選項02</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad03">
                    <label for="rad03" class="form-check-label">選項03</label>
                </div>
                <div class="form-check">
                    <input type="radio" class="form-check-input" name="myradio" id="rad04">
                    <label for="rad04" class="form-check-label">選項04</label>
                </div>
        </div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">4. switch</div>
        <div class="row">
            <div class="col-12">
                <div class="form-check form-switch">
                    <input type="checkbox" class="form-check-input" name="" id="">
                    <label for="" class="form-check-label">開燈/關燈</label>
                </div>
            </div>
        </div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">5. range</div>
        <div class="mb-3">
            <label for="range01" class="form-label">數量</label>
            <input type="range" class="form-range" min="1" max="100" step="1" value="50" id="range01">
        </div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">6. input-group</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 input-group">
                    <span class="input-group-text">帳號</span>
                    <input type="text" class="form-control">
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3 input-group">
                    <input type="text" class="form-control">
                    <span class="input-group-text">@gmail.com</span>
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3 input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" min="0" max="1000" step="1" value="0"   class="form-control">
                    <span class="input-group-text">NT</span>
                </div>
            </div>
            <div class="col-12">
                <div class="mb-3 input-group">
                    <input type="text" class="form-control form-control-lg" name="" id="">
                    <button class="btn btn-primary">搜尋</button>
                </div>
            </div>
        </div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">7. Floating Labels(浮動標籤)</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3 form-floating">
                    <input type="text" class="form-control form-control-lg" placeholder="">
                    <label for="username" class="form-label">帳號</label> 
                </div>
            </div>
        </div>

        <div class="display-5 fw-900 mt-3 text-primary p-3">8. 表單驗證</div>
        <div class="row">
            <div class="col-12">
                <div class="mb-3">
                    <label for="username" class="form-label">帳號</label>
                    <input type="text" class="form-control is-valid" id="username" placeholder="請輸入一個英文大寫...">
                    <div class="valid-feedback">帳號輸入符合規定!</div>
                    <div class="invalid-feedback">帳號輸入不符合規定!</div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密碼</label>
                    <input type="password" class="form-control is-invalid" id="password">
                    <div class="valid-feedback">密碼輸入符合規定!</div>
                    <div class="invalid-feedback">密碼輸入不符合規定!</div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>
</html>
